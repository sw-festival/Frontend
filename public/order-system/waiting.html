<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대기 순번 확인 - MEMORY 주점</title>
    <link rel="stylesheet" href="/css/baseball-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/images/icon.png">
    <style>
        /* KBO Dia Gothic 폰트 추가 */
        @font-face {
            font-family: "KBO Dia Gothic";
            src: url("../../../src/fonts/KBODiaGothicTTF/KBODiaGothic_light.ttf") format("truetype");
            font-weight: 300;
            font-style: normal;
        }
        @font-face {
            font-family: "KBO Dia Gothic";
            src: url("../../../src/fonts/KBODiaGothicTTF/KBODiaGothic_medium.ttf") format("truetype");
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: "KBO Dia Gothic";
            src: url("../../../src/fonts/KBODiaGothicTTF/KBODiaGothic_bold.ttf") format("truetype");
            font-weight: 700;
            font-style: normal;
        }

        /* 전체 페이지에 KBO Dia Gothic 폰트 기본 적용 */
        * {
            font-family: "KBO Dia Gothic", 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
        }

        /* News Text 스타일 (우선순위 높게) */
        .news-text .main-news {
            color: #EDECED !important;
            font-family: "KBO Dia Gothic" !important;
            font-size: 12px !important;
            font-style: normal !important;
            text-align: center !important;
            font-weight: 500 !important;
            line-height: 130% !important;
            letter-spacing: -0.24px !important;
            margin: 0 0 5px 0 !important;
        }

        .news-text .news-source {
            color: #EDECED !important;
            text-align: right !important;
            font-family: "KBO Dia Gothic" !important;
            font-size: 10px !important;
            font-style: normal !important;
            font-weight: 300 !important;
            line-height: 130% !important;
            letter-spacing: -0.2px !important;
            margin: 0 !important;
        }

        .waiting-title {
            color: #EDECED;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .waiting-number {
            color: #EDECED;
            font-size: 4rem;
            font-weight: 700;
            margin: 1rem 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .waiting-subtitle {
            color: #EDECED;
            font-size: 16px;
            font-weight: 300;
        }

        .progress-header {
            color: #EDECED;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
        }

        .progress-steps {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2rem 0;
        }

        .progress-step {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .step-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #666;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            transition: all 0.3s;
        }

        .step-circle.active {
            background: #1a5490;
            box-shadow: 0 0 20px rgba(26, 84, 144, 0.5);
        }

        .step-circle.completed {
            background: #28a745;
        }

        .step-label {
            color: #EDECED;
            font-size: 14px;
            font-weight: 500;
        }

        .progress-line {
            position: absolute;
            top: 25px;
            left: 50%;
            right: -50%;
            height: 3px;
            background: #666;
            z-index: -1;
        }

        .progress-line.active {
            background: #1a5490;
        }

        .progress-line.completed {
            background: #28a745;
        }

        .estimated-time {
            text-align: center;
            margin-top: 2rem;
        }

        .time-label {
            color: #EDECED;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .time-value {
            color: #EDECED;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #order-details {
            background: url('/images/basic-bg.png') no-repeat center center;
            background-size: cover;
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem 0;
            position: relative;
            overflow: hidden;
        }

        #order-details h2 {
            color: #EDECED;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .order-item {
            color: #EDECED;
            font-size: 16px;
            font-weight: 300;
            margin: 0.5rem 0;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(237, 236, 237, 0.2);
        }

        .order-total {
            color: #EDECED;
            font-size: 20px;
            font-weight: 700;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid rgba(237, 236, 237, 0.3);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .score-info {
            flex-direction: column;
            align-items: flex-end;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #ff4444;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .live-text {
            color: #EDECED;
            font-size: 12px;
            font-weight: 500;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .loading {
            text-align: center;
            color: #EDECED;
            font-size: 18px;
            font-weight: 500;
            padding: 3rem;
        }

        .hidden {
            display: none !important;
        }

        /* 반응형 스타일 */
        @media (max-width: 768px) {
            .waiting-number {
                font-size: 3rem;
            }

            .progress-steps {
                flex-direction: column;
                gap: 1rem;
            }

            .progress-line {
                display: none;
            }

            .step-circle {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .time-value {
                font-size: 1.5rem;
            }

            #order-details {
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .waiting-number {
                font-size: 2.5rem;
            }

            .progress-header {
                font-size: 18px;
            }

            .waiting-title {
                font-size: 16px;
            }

            .waiting-subtitle {
                font-size: 14px;
            }
        }

        /* ====== 야구 베이스 상태 표시기 스타일 ====== */
        .baseball-status-indicator {
            margin: 0.5rem 2rem 2rem 2rem;
            padding: 2rem;
            background: linear-gradient(135deg, #1a5490 0%, #2c3e50 100%);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .baseball-field {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            aspect-ratio: 1;
        }

        .diamond {
            position: relative;
            width: 100%;
            height: 100%;
            transform: rotate(45deg);
        }

        /* 베이스 공통 스타일 */
        .base {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotate(-45deg);
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
        }

        .base.active {
            background: rgba(26, 84, 144, 0.8);
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transform: rotate(-45deg) scale(1.1);
        }

        .base.current {
            background: rgba(40, 167, 69, 0.9);
            border-color: #28a745;
            box-shadow: 0 0 25px rgba(40, 167, 69, 0.7);
            animation: currentBasePulse 2s infinite;
        }

        @keyframes currentBasePulse {
            0%, 100% { transform: rotate(-45deg) scale(1.1); }
            50% { transform: rotate(-45deg) scale(1.15); }
        }

        /* 베이스 위치 */
        .first-base {
            top: 50%;
            right: 0;
            transform: translate(50%, -50%) rotate(-45deg);
        }

        .second-base {
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        .third-base {
            top: 50%;
            left: 0;
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        .home-base {
            bottom: 0;
            left: 50%;
            transform: translate(-50%, 50%) rotate(-45deg);
            background: rgba(255, 215, 0, 0.2);
            border-color: #FFD700;
        }

        .home-base.active,
        .home-base.current {
            background: rgba(255, 215, 0, 0.9);
            border-color: #FFD700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
        }

        /* 베이스 아이콘 */
        .base-icon {
            font-size: 1.5rem;
            margin-bottom: 0.2rem;
        }

        .base-label {
            color: #EDECED;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 0.1rem;
        }

        /* 베이스 설명 텍스트 (베이스 외부에 배치) */
        .base-description {
            position: absolute;
            color: #EDECED;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            z-index: 5;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            transition: all 0.4s ease;
        }

        .base-description.active {
            color: #FFD700;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* 각 베이스별 설명 위치 */
        .first-desc {
            top: 50%;
            right: -60px;
            transform: translateY(-50%);
        }

        .second-desc {
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
        }

        .third-desc {
            top: 50%;
            left: -60px;
            transform: translateY(-50%);
        }

        .home-desc {
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 야구선수 */
        .player {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 10;
        }

        .base.current .player {
            opacity: 1;
            animation: playerBounce 1s infinite alternate;
        }

        @keyframes playerBounce {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(-5px); }
        }

        /* 베이스 연결선 */
        .base-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            height: 2px;
            transition: all 0.4s ease;
        }

        .base-line.active {
            background: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .line-1-2 {
            top: 25%;
            right: 25%;
            width: 25%;
            transform: rotate(-45deg);
            transform-origin: right center;
        }

        .line-2-3 {
            top: 25%;
            left: 25%;
            width: 25%;
            transform: rotate(45deg);
            transform-origin: left center;
        }

        .line-3-home {
            bottom: 25%;
            left: 25%;
            width: 25%;
            transform: rotate(-45deg);
            transform-origin: left center;
        }

        .line-home-1 {
            bottom: 25%;
            right: 25%;
            width: 25%;
            transform: rotate(45deg);
            transform-origin: right center;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .baseball-field {
                max-width: 350px;
            }

            .base {
                width: 60px;
                height: 60px;
            }

            .base-icon {
                font-size: 1.2rem;
            }

            .base-label {
                font-size: 10px;
            }

            .player {
                font-size: 1.4rem;
                top: -20px;
            }

            .base-description {
                font-size: 12px;
            }

            .first-desc {
                right: -50px;
            }

            .second-desc {
                top: -35px;
            }

            .third-desc {
                left: -50px;
            }

            .home-desc {
                bottom: -35px;
            }
        }

        @media (max-width: 480px) {
            .baseball-field {
                max-width: 280px;
            }

            .base {
                width: 50px;
                height: 50px;
            }

            .base-icon {
                font-size: 1rem;
            }

            .base-label {
                font-size: 9px;
            }

            .player {
                font-size: 1.2rem;
                top: -15px;
            }

            .base-description {
                font-size: 10px;
            }

            .first-desc {
                right: -40px;
            }

            .second-desc {
                top: -30px;
            }

            .third-desc {
                left: -40px;
            }

            .home-desc {
                bottom: -30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-logo">
                <img src="/images/main-logo.png" alt="MEMORY 주점 로고" style="width: 152px; height: 124px; display: block; margin: 0 auto;">
            </div>
            <div class="baseball-scoreboard">
                <div class="score-info">
                    <div class="news-text">
                        <p class="main-news">대기 순번 확인 - 실시간 주문 현황을 확인하세요</p>
                        <p class="news-source">-한양대 ERICA MEMORY 디자인국 보도-</p>
                    </div>
                    <div class="live-indicator">
                        <span class="live-dot"></span>
                        <span class="live-text">실시간</span>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <section id="waiting-section">
                <div id="waiting-info" class="loading">
                    대기 순번을 확인하는 중...
                </div>
                
                <div id="order-details" class="hidden">
                    <h2>📋 주문 내역</h2>
                    <div id="order-summary"></div>
                </div>

                <div id="waiting-status" class="hidden">
                    <div class="waiting-number-container">
                        <div class="waiting-title">현재 대기 순번</div>
                        <div class="waiting-number" id="waiting-number">-</div>
                        <div class="waiting-subtitle">앞에 <span id="ahead-count">-</span>팀이 기다리고 있습니다</div>
                    </div>
                    
                    <div class="status-progress">
                        <div class="progress-header">
                            <h3>📍 주문 진행 상황</h3>
                            <div class="auto-refresh-indicator">
                                <span class="refresh-dot"></span>
                                <span>30초마다 자동 새로고침</span>
                            </div>
                    </div>
                    
                    <!-- 야구 베이스 상태 표시기 -->
                    <div class="baseball-status-indicator">
                        <div class="baseball-field">
                            <!-- 야구장 다이아몬드 -->
                            <div class="diamond">
                                <!-- 1루 베이스 -->
                                <div class="base first-base" id="base-first">
                                    <div class="base-icon">⚾</div>
                                    <div class="base-label">주문 접수</div>
                                    <div class="player" id="player-first">🧢</div>
                                </div>
                                
                                <!-- 2루 베이스 -->
                                <div class="base second-base" id="base-second">
                                    <div class="base-icon">⚾</div>
                                    <div class="base-label">입금 확인</div>
                                    <div class="player" id="player-second">🧢</div>
                                </div>
                                
                                <!-- 3루 베이스 -->
                                <div class="base third-base" id="base-third">
                                    <div class="base-icon">⚾</div>
                                    <div class="base-label">조리 시작</div>
                                    <div class="player" id="player-third">🧢</div>
                                </div>
                                
                                <!-- 홈베이스 -->
                                <div class="base home-base" id="base-home">
                                    <div class="base-icon">🏠</div>
                                    <div class="base-label">완료</div>
                                    <div class="player" id="player-home">🎉</div>
                                </div>
                                
                                <!-- 베이스 연결선 -->
                                <div class="base-line line-1-2"></div>
                                <div class="base-line line-2-3"></div>
                                <div class="base-line line-3-home"></div>
                                <div class="base-line line-home-1"></div>
                            </div>
                        </div>
                    </div>
                        
                        <div class="estimated-time">
                            <div class="time-info">
                                <span class="time-label">예상 완료 시간</span>
                                <span class="time-value" id="estimated-completion">계산중...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="refresh-btn">🔄 새로고침</button>
                    <button id="back-btn">🏠 처음으로</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Firebase 설정 및 대기 순번 로직 -->
    <script src="js/firebase-config.js"></script>
    <script type="module" src="/js/waiting.js"></script>
</body>
</html>
